name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can check every commit on the PR.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Commitlint (PR commits)
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint
        run: npm run lint

      - name: Standards
        run: npm run check

      - name: Test
        run: npm test

      - name: Smoke (real site, Chromium download)
        run: |
          npx playwright-core install --with-deps chromium
          node bin/site2paper.mjs https://example.com --limit 2 --format compare --out ci-out
          test -f ci-out/report.json

      - name: Smoke (new user, packed tarball)
        run: npm run smoke
