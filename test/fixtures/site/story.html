<!doctype html>
<meta charset="utf-8">
<title>Fixture story</title>
<style>
  body { margin: 0; font: 18px/1.5 Georgia, serif; }
  .track { height: 300vh; position: relative; }
  .frame { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; font-size: 48px; color: #fff; }
  canvas { width: 240px; height: 240px; }
  .after { padding: 48px 24px; }
</style>
<div class="track"><div class="frame" id="frame"><div><canvas id="c" width="240" height="240"></canvas><p id="t">Scroll 0%</p></div></div></div>
<div class="after"><h2>After the story</h2><p>Normal content resumes here.</p></div>
<script>
  const ctx = document.getElementById("c").getContext("2d");
  const paint = () => {
    const track = document.querySelector(".track");
    const t = Math.min(1, Math.max(0, scrollY / (track.offsetHeight - innerHeight)));
    document.getElementById("frame").style.background = `hsl(${Math.round(220 - t * 200)} 60% 40%)`;
    document.getElementById("t").textContent = `Scroll ${Math.round(t * 100)}%`;
    ctx.clearRect(0, 0, 240, 240); ctx.fillStyle = "#fff"; ctx.fillRect(20 + t * 160, 100, 40, 40);
  };
  addEventListener("scroll", paint);
  paint();
</script>
