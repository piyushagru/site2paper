<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="t d">
  <title id="t">site2paper architecture</title>
  <desc id="d">Control plane in src/cli.mjs drives four stages: discovery (pure), a Playwright render tier with one isolated page per URL, a pure layout engine that packs screenshots into columns and cuts on blank rows, and pdf-lib composition. A retry controller re-enters capture for failed URLs with linear backoff.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .zone { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .box { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.2; }
    .pure { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .contract { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 2 3; }
    .out { fill: #fff8f8; stroke: #cf222e; stroke-width: 1.5; }
    .retryz { fill: #fffafa; stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .h1 { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .zt { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: 1.1px; }
    .zs { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .bt { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .ln { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #424a53; }
    .num { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #cf222e; }
    .lab { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .rl { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #cf222e; }
    .pill { fill: #ffffff; stroke: #8c959f; }
    .pt { font: 600 10.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; letter-spacing: 0.8px; }
    .f { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .fd { stroke: #57606a; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
    .fr { stroke: #cf222e; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .note { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1599" height="959" rx="14"/>
  <text class="h1" x="40" y="40">site2paper architecture</text>
  <text class="zs" x="1560" y="40" text-anchor="end">Node 20+ · ESM · deps: playwright-core, sharp, pdf-lib</text>

  <!-- CONTROL PLANE -->
  <rect class="zone" x="40" y="60" width="1520" height="100" rx="10"/>
  <text class="zt" x="56" y="84">CONTROL PLANE</text>
  <text class="zs" x="186" y="84">bin/site2paper.mjs · src/cli.mjs</text>
  <rect class="box" x="56" y="98" width="300" height="46" rx="6"/>
  <text class="bt" x="72" y="126">parseArgs(argv) → Options</text>
  <rect class="box" x="420" y="98" width="340" height="46" rx="6"/>
  <text class="bt" x="436" y="126">sheetFor(paper, landscape, N)</text>
  <rect class="box" x="824" y="98" width="340" height="46" rx="6"/>
  <text class="bt" x="840" y="126">run(): owns Browser, stages</text>
  <rect class="out" x="1228" y="98" width="316" height="46" rx="6"/>
  <text class="bt" x="1244" y="126">report.json · exit 0 | 1 | 3</text>
  <path class="f" d="M356 121 H418" marker-end="url(#a)"/>
  <path class="f" d="M760 121 H822" marker-end="url(#a)"/>
  <path class="f" d="M1164 121 H1226" marker-end="url(#a)"/>
  <path class="fd" d="M994 144 V180 H190 V194" marker-end="url(#a)"/>
  <path class="fd" d="M994 180 H640 V194" marker-end="url(#a)"/>
  <path class="fd" d="M994 180 H1090 V194" marker-end="url(#a)"/>
  <path class="fd" d="M994 180 H1420 V194" marker-end="url(#a)"/>

  <!-- DISCOVERY -->
  <rect class="zone" x="40" y="196" width="300" height="524" rx="10"/>
  <text class="zt" x="56" y="222">DISCOVERY</text>
  <text class="zs" x="56" y="240">src/discover.mjs</text>
  <rect class="pill" x="232" y="208" width="94" height="22" rx="11"/>
  <text class="pt" x="279" y="223" text-anchor="middle">PURE · TESTED</text>

  <rect class="box" x="56" y="256" width="268" height="44" rx="6"/>
  <text class="ln" x="72" y="283">in: start URL | --pages file</text>
  <rect class="pure" x="56" y="320" width="268" height="82" rx="6"/>
  <text class="bt" x="72" y="344">fromSitemap()</text>
  <text class="ln" x="72" y="366">urlset | sitemapindex</text>
  <text class="ln" x="72" y="386">fan-out ≤ 10 children</text>
  <rect class="pure" x="56" y="434" width="268" height="82" rx="6"/>
  <text class="bt" x="72" y="458">crawl() · BFS</text>
  <text class="ln" x="72" y="480">openPage = linksOn()</text>
  <text class="ln" x="72" y="500">client-rendered nav counts</text>
  <rect class="pure" x="56" y="536" width="268" height="62" rx="6"/>
  <text class="bt" x="72" y="560">normalize · dedupe</text>
  <text class="ln" x="72" y="582">sameOrigin(), strip #?/</text>
  <rect class="pure" x="56" y="618" width="268" height="62" rx="6"/>
  <text class="bt" x="72" y="642">orderPages()</text>
  <text class="ln" x="72" y="664">home first, depth asc</text>
  <path class="f" d="M190 300 V318" marker-end="url(#a)"/>
  <path class="f" d="M190 402 V432" marker-end="url(#a)"/>
  <text class="lab" x="198" y="422">∅ sitemap</text>
  <path class="f" d="M190 516 V534" marker-end="url(#a)"/>
  <path class="f" d="M324 361 H332 V567 H326" marker-end="url(#a)"/>
  <path class="f" d="M190 598 V616" marker-end="url(#a)"/>
  <text class="lab" x="56" y="708">→ URL[]  n ≤ --limit (50)</text>

  <!-- RENDER TIER -->
  <rect class="zone" x="380" y="196" width="520" height="524" rx="10"/>
  <text class="zt" x="396" y="222">RENDER TIER</text>
  <text class="zs" x="396" y="240">src/browser.mjs · src/capture.mjs · src/rules.mjs</text>
  <rect class="pill" x="716" y="208" width="168" height="22" rx="11"/>
  <text class="pt" x="800" y="223" text-anchor="middle">1 ISOLATED PAGE PER URL</text>

  <rect class="box" x="396" y="256" width="488" height="44" rx="6"/>
  <text class="ln" x="412" y="283">launchBrowser(): chrome → msedge → bundled → install</text>

  <rect class="box" x="396" y="316" width="320" height="300" rx="6"/>
  <text class="bt" x="412" y="340">capture(url) · Page lifecycle</text>
  <text class="num" x="412" y="366">01</text><text class="ln" x="440" y="366">newPage W×900, reducedMotion</text>
  <text class="num" x="412" y="390">02</text><text class="ln" x="440" y="390">goto domcontentloaded, 60s</text>
  <text class="num" x="412" y="414">03</text><text class="ln" x="440" y="414">assert status &lt; 400</text>
  <text class="num" x="412" y="438">04</text><text class="ln" x="440" y="438">networkidle, bounded 8s</text>
  <text class="num" x="412" y="462">05</text><text class="ln" x="440" y="462">error-page text heuristic</text>
  <text class="num" x="412" y="486">06</text><text class="ln" x="440" y="486">CSS: CMP hide, carousel grid</text>
  <text class="num" x="412" y="510">07</text><text class="ln" x="440" y="510">JS: unpin fixed/sticky, reveal</text>
  <text class="num" x="412" y="534">08</text><text class="ln" x="440" y="534">scroll walk, step vh/2</text>
  <text class="num" x="412" y="558">09</text><text class="ln" x="440" y="558">img decode ∥ race 8s</text>
  <text class="num" x="412" y="582">10</text><text class="ln" x="440" y="582">screenshot fullPage ≤ 40k px</text>

  <rect class="box" x="396" y="636" width="320" height="64" rx="6"/>
  <text class="bt" x="412" y="660">describe() · sharp raw</text>
  <text class="ln" x="412" y="682">blankRows[y] = (max-min) &lt; 6</text>
  <path class="f" d="M556 616 V634" marker-end="url(#a)"/>

  <rect class="box" x="732" y="316" width="152" height="104" rx="6"/>
  <text class="bt" x="748" y="340">printNative()</text>
  <text class="ln" x="748" y="362">page.pdf()</text>
  <text class="ln" x="748" y="382">print CSS</text>
  <text class="ln" x="748" y="402">baseline only</text>
  <text class="lab" x="732" y="440">native | compare</text>

  <rect class="contract" x="732" y="560" width="152" height="140" rx="6"/>
  <text class="lab" x="748" y="584">Shot {</text>
  <text class="ln" x="760" y="606">png: Buffer</text>
  <text class="ln" x="760" y="626">width, height</text>
  <text class="ln" x="760" y="646">blankRows:</text>
  <text class="ln" x="760" y="666"> Uint8Array</text>
  <text class="lab" x="748" y="688">}</text>
  <path class="f" d="M716 668 H730" marker-end="url(#a)"/>

  <path class="fd" d="M324 475 H352 V278 H394" marker-end="url(#a)"/>
  <path class="f" d="M324 649 H362 V466 H394" marker-end="url(#a)"/>

  <!-- LAYOUT ENGINE -->
  <rect class="zone" x="940" y="196" width="300" height="524" rx="10"/>
  <text class="zt" x="956" y="222">LAYOUT ENGINE</text>
  <text class="zs" x="956" y="240">src/layout.mjs</text>
  <rect class="pill" x="1132" y="208" width="94" height="22" rx="11"/>
  <text class="pt" x="1179" y="223" text-anchor="middle">PURE · TESTED</text>

  <rect class="pure" x="956" y="256" width="268" height="64" rx="6"/>
  <text class="bt" x="972" y="280">columnScale()</text>
  <text class="ln" x="972" y="302">pt/px = colW / viewportW</text>
  <rect class="pure" x="956" y="340" width="268" height="170" rx="6"/>
  <text class="bt" x="972" y="364">flowPages()</text>
  <text class="ln" x="972" y="388">first-fit column packing</text>
  <text class="ln" x="972" y="410">fits column → never split</text>
  <text class="ln" x="972" y="432">else cut at snap(page, y)</text>
  <text class="ln" x="972" y="454">snap: scan blankRows ↑600px</text>
  <text class="ln" x="972" y="476">minStart 60pt per column</text>
  <text class="ln" x="972" y="498">footer: last page only</text>
  <rect class="contract" x="956" y="530" width="268" height="140" rx="6"/>
  <text class="lab" x="972" y="554">Placement[] {</text>
  <text class="ln" x="984" y="578">sheet, column, page</text>
  <text class="ln" x="984" y="600">srcTop, srcHeight  (px)</text>
  <text class="ln" x="984" y="622">y, labelY?  (pt)</text>
  <text class="lab" x="972" y="654">}</text>
  <path class="f" d="M1090 320 V338" marker-end="url(#a)"/>
  <path class="f" d="M1090 510 V528" marker-end="url(#a)"/>
  <path class="f" d="M884 630 H912 V425 H954" marker-end="url(#a)"/>

  <!-- COMPOSITION -->
  <rect class="zone" x="1280" y="196" width="280" height="524" rx="10"/>
  <text class="zt" x="1296" y="222">COMPOSITION</text>
  <text class="zs" x="1296" y="240">src/book.mjs</text>
  <rect class="box" x="1296" y="256" width="248" height="110" rx="6"/>
  <text class="bt" x="1312" y="280">buildBook()</text>
  <text class="ln" x="1312" y="302">sharp.extract(slice)</text>
  <text class="ln" x="1312" y="322">→ JPEG q82</text>
  <text class="ln" x="1312" y="342">pdf-lib drawImage, folio</text>
  <rect class="box" x="1296" y="382" width="248" height="56" rx="6"/>
  <text class="bt" x="1312" y="406">buildSheets()</text>
  <text class="ln" x="1312" y="426">1 page / sheet, fit</text>
  <rect class="box" x="1296" y="454" width="248" height="56" rx="6"/>
  <text class="bt" x="1312" y="478">mergePdfs()</text>
  <text class="ln" x="1312" y="498">copyPages(native[])</text>
  <rect class="out" x="1296" y="534" width="248" height="166" rx="6"/>
  <text class="lab" x="1312" y="558">ARTIFACTS</text>
  <text class="ln" x="1312" y="582">&lt;host&gt;-&lt;date&gt;-&lt;W&gt;px-</text>
  <text class="ln" x="1324" y="602">book.pdf</text>
  <text class="ln" x="1324" y="622">sheet.pdf</text>
  <text class="ln" x="1324" y="642">native.pdf</text>
  <text class="ln" x="1312" y="664">report.json</text>
  <text class="ln" x="1312" y="686">compare → stdout</text>
  <path class="f" d="M1224 600 H1258 V311 H1294" marker-end="url(#a)"/>
  <path class="f" d="M1420 366 V380" marker-end="url(#a)"/>
  <path class="f" d="M1420 510 V532" marker-end="url(#a)"/>
  <path class="fd" d="M884 368 H924 V740 H1262 V482 H1294" marker-end="url(#a)"/>
  <text class="lab" x="1100" y="734" text-anchor="middle">native Buffer[]</text>

  <!-- RETRY CONTROLLER -->
  <rect class="retryz" x="380" y="760" width="860" height="128" rx="10"/>
  <text class="zt" x="396" y="786" fill="#cf222e">RETRY CONTROLLER</text>
  <text class="zs" x="560" y="786">run() · deferred, after the full pass</text>
  <text class="ln" x="396" y="814">errors: Map&lt;index, reason&gt;</text>
  <text class="ln" x="396" y="836">round r = 1..R  (R = --retries, default 2)</text>
  <text class="ln" x="396" y="858">backoff: 3s × r, linear</text>
  <text class="ln" x="820" y="814">re-enters capture() for failed i only</text>
  <text class="ln" x="820" y="836">residual → report.failed, exit 3</text>
  <text class="ln" x="820" y="858">invariant: one bad page never aborts</text>
  <path class="fr" d="M396 590 H388 V756" marker-end="url(#r)"/>
  <text class="rl" x="396" y="742">throw</text>
  <path class="fr" d="M724 758 V560 H718" marker-end="url(#r)"/>
  <text class="rl" x="732" y="742">re-shoot i</text>

  <!-- LEGEND -->
  <rect class="zone" x="1280" y="760" width="280" height="128" rx="10"/>
  <text class="zt" x="1296" y="786">LEGEND</text>
  <path class="f" d="M1296 808 H1336" marker-end="url(#a)"/><text class="note" x="1348" y="812">data flow</text>
  <path class="fd" d="M1296 830 H1336" marker-end="url(#a)"/><text class="note" x="1348" y="834">control / optional path</text>
  <path class="fr" d="M1296 852 H1336" marker-end="url(#r)"/><text class="note" x="1348" y="856">failure path</text>
  <rect class="pure" x="1296" y="866" width="40" height="14" rx="3"/><text class="note" x="1348" y="878">pure, no I/O</text>

  <text class="note" x="40" y="920">Capture is sequential: one live Page at a time keeps Chromium memory flat. Shots stay in memory as PNG until composition.</text>
  <text class="note" x="40" y="940">Row-variance scan is O(W·H) per shot. Layout and discovery import no browser or image library, so they run under node --test.</text>
</svg>
